<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Tic Tac Toe</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1 style="text-align:center">Tic Tac Toe</h1>
    <h5>It's <span id="turn">X</span>'s turn</h5>
    <div style="font-size:39px;font-family: monospace;">
      <a>&nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;</a><br>
      <a>&nbsp;</a>
      <a id="0" onclick="clicked(0)">_</a> | <a id="1" onclick="clicked(1)">_</a> | <a id="2" onclick="clicked(2)">_</a><br>
      <a>&nbsp;---|---|---</a><br>&nbsp;
      <a id="3" onclick="clicked(3)">_</a> | <a id="4" onclick="clicked(4)">_</a> | <a id="5" onclick="clicked(5)">_</a><br>
      <a>&nbsp;---|---|---</a><br>&nbsp;
      <a id="6" onclick="clicked(6)">_</a> | <a id="7" onclick="clicked(7)">_</a> | <a id="8" onclick="clicked(8)">_</a><br>
      <a>&nbsp;&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;|&nbsp;&nbsp;&nbsp;</a><br>
    </div>
    <script src="script.js"></script>
    <script src="https://kihtrak.com/cloud_variable/cloudify.min.js"></script>
  </body>
</html>
