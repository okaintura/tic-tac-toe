<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Tic Tac Toe</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Tic Tac Toe</h1>
    <h5>It's <span id="turn">X</span>'s turn</h5>
    <div class="board">
      <div class="grid">
        <div class="cell" id="0" onclick="clicked(0)"></div>
        <div class="cell" id="1" onclick="clicked(1)"></div>
        <div class="cell" id="2" onclick="clicked(2)"></div>
        <div class="cell" id="3" onclick="clicked(3)"></div>
        <div class="cell" id="4" onclick="clicked(4)"></div>
        <div class="cell" id="5" onclick="clicked(5)"></div>
        <div class="cell" id="6" onclick="clicked(6)"></div>
        <div class="cell" id="7" onclick="clicked(7)"></div>
        <div class="cell" id="8" onclick="clicked(8)"></div>
      </div>
    </div>
    <button onclick="resetGame()">Reset Game</button>
    <script src="script.js"></script>
  </body>
</html>
